<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f5f4f0">
    <meta name="description" content="Личный сайт Айрата Садыкова. Скоро здесь появятся проекты и истории.">
    <title>Айрат Садыков — скоро</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #202b39; background: #f5f4f0; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px 24px; }
      main { width: min(100%, 760px); padding: 64px 0; }
      .address { margin: 0 0 64px; font-size: 14px; letter-spacing: .08em; color: #5c6572; }
      .status { display: inline-flex; align-items: center; gap: 10px; margin: 0 0 24px; font-size: 14px; color: #315783; }
      .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
      h1 { margin: 0; font-size: clamp(40px, 7vw, 72px); font-weight: 550; line-height: 1.08; letter-spacing: -.045em; overflow-wrap: anywhere; }
      .intro { max-width: 540px; margin: 28px 0 0; font-size: clamp(18px, 3vw, 23px); line-height: 1.55; color: #5c6572; }
      footer { margin-top: 80px; padding-top: 24px; border-top: 1px solid #d8dbe0; font-size: 14px; color: #5c6572; }
      @media (max-width: 480px) { main { padding: 24px 0; } .address { margin-bottom: 48px; } footer { margin-top: 56px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="address">a1rrat.github.io</p>
      <p class="status">Сайт в процессе</p>
      <h1>Привет, я<br>Айрат Садыков.</h1>
      <p class="intro">Скоро здесь появятся мои проекты и истории. А пока — до скорой встречи.</p>
      <footer>Личный сайт · Айрат Садыков</footer>
    </main>
  </body>
</html>
